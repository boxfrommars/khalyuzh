server {
    listen 80;
    listen [::]:80;
    server_name khalyuzh.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name khalyuzh.example.com;

    ssl_certificate /etc/letsencrypt/live/khalyuzh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khalyuzh.example.com/privkey.pem;

    root /var/www/khalyuzh/public;
    charset utf-8;

    access_log /var/log/nginx/khalyuzh.access.log;
    error_log /var/log/nginx/khalyuzh.error.log;

    location = /assets/app.css {
        try_files $uri =404;
    }

    location = /assets/common.js {
        try_files $uri =404;
    }

    location = /assets/food.js {
        try_files $uri =404;
    }

    location = /assets/weight.js {
        try_files $uri =404;
    }

    location = /assets/report.js {
        try_files $uri =404;
    }

    location = /weight {
        return 301 /weight/;
    }

    location = /report {
        return 301 /report/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /admin/weight {
        return 301 /admin/weight/;
    }

    location ^~ /admin/ {
        auth_basic "Khalyuzh admin";
        auth_basic_user_file /etc/nginx/.htpasswd-khalyuzh;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param KHALYUZH_CONFIG_FILE /etc/example/khalyuzh.json;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param KHALYUZH_CONFIG_FILE /etc/example/khalyuzh.json;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
