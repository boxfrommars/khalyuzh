server {
    listen 80;
    listen [::]:80;
    server_name khalyuzh.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name khalyuzh.example.com;

    ssl_certificate /etc/letsencrypt/live/khalyuzh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khalyuzh.example.com/privkey.pem;

    root /var/www/khalyuzh/public;
    charset utf-8;

    access_log /var/log/nginx/khalyuzh.access.log;
    error_log /var/log/nginx/khalyuzh.error.log;

    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /api.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_param SCRIPT_NAME /api.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
        auth_basic "Khalyuzh admin";
        auth_basic_user_file /etc/nginx/.htpasswd-khalyuzh;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
        fastcgi_param SCRIPT_NAME /admin/index.php;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /admin/api.php {
        auth_basic "Khalyuzh admin";
        auth_basic_user_file /etc/nginx/.htpasswd-khalyuzh;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/admin/api.php;
        fastcgi_param SCRIPT_NAME /admin/api.php;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ^~ /admin/ {
        auth_basic "Khalyuzh admin";
        auth_basic_user_file /etc/nginx/.htpasswd-khalyuzh;
        return 404;
    }

    location / {
        return 404;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        return 404;
    }
}
